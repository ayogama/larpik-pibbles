<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XXXTTRA DDOSSER</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        body {
            background:
                linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                url('https://fbi.cults3d.com/uploaders/16862511/illustration-file/ca1d4109-92fb-4952-af11-199e2ea62c10/xxxmix-xxxtentacion.gif') center center / cover no-repeat;
            filter: grayscale(100%);
        }

        .topbar {
            height: 28px;
            background: linear-gradient(#d9d9d9, #bfbfbf);
            border-bottom: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            color: #111;
            font-size: 12px;
            font-weight: 700;
        }

        .window-controls {
            display: flex;
            gap: 5px;
        }

        .control {
            width: 16px;
            height: 14px;
            border: 1px solid #888;
            background: #eee;
        }

        .control.close {
            background: #d9534f;
            border-color: #8b2c2a;
        }

        .overlay {
            width: 100%;
            height: calc(100% - 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.58);
        }

        .layout {
            display: flex;
            align-items: stretch;
            gap: 18px;
            width: 1040px;
            max-width: 98vw;
            height: 540px;
        }

        .panel {
            flex: 1 1 auto;
            position: relative;
            color: #fff;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.03), rgba(0,0,0,0.7)),
                rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 35px rgba(0,0,0,0.85);
            overflow: visible;
        }

        .console {
            width: 260px;
            height: 100%;
            background: rgba(0,0,0,0.86);
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 0 14px rgba(0,0,0,0.35);
            color: #b8b8b8;
            font-family: "Courier New", monospace;
            font-size: 11px;
            padding: 8px;
            overflow: hidden;
            white-space: pre-wrap;
        }

        .bg-figures {
            position: absolute;
            inset: 0;
            background:
                url('https://cdn-images.dzcdn.net/images/cover/f65d5ac8c3a1cdba3d797ade79a47857/0x1900-000000-80-0-0.jpg') left center / 46% auto no-repeat,
                url('https://cdn-images.dzcdn.net/images/cover/f65d5ac8c3a1cdba3d797ade79a47857/0x1900-000000-80-0-0.jpg') right center / 46% auto no-repeat;
            filter: grayscale(100%) contrast(120%);
            opacity: 0.55;
        }

        .grain {
            position: absolute;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
            opacity: 0.28;
            pointer-events: none;
        }

        .center-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 48px;
            text-align: center;
        }

        .main-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 56px;
            text-shadow: 0 0 8px rgba(255,255,255,0.18);
        }

        .label {
            font-size: 21px;
            font-weight: 800;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .input-line {
            width: 220px;
            border-bottom: 2px solid rgba(255,255,255,0.55);
            padding-bottom: 3px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 14px;
            outline: none;
        }

        .input-line:empty::before {
            content: attr(data-placeholder);
            color: rgba(255,255,255,0.45);
        }

        .send-btn {
            margin-top: 18px;
            width: 210px;
            height: 28px;
            background: #ededed;
            border: 3px solid #bbb;
            color: #111;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #fff;
        }

        .progress-wrap {
            width: 320px;
            margin-top: 22px;
            border: 1px solid #666;
            background: rgba(0,0,0,0.6);
            padding: 6px;
        }

        .progress-label {
            font-size: 11px;
            color: #aaa;
            text-align: left;
            margin-bottom: 5px;
            font-family: "Courier New", monospace;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            border: 1px solid #999;
            background: #111;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ffb84d);
            transition: width 0.15s linear;
        }

        .bottom-text {
            position: absolute;
            bottom: 22px;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 700;
        }

        .bottom-text .small {
            display: block;
            margin-top: 6px;
            font-size: 11px;
        }

        .toast-stack {
            position: fixed;
            top: 42px;
            right: 16px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            pointer-events: none;
        }

        .toast {
            background: rgba(15,15,15,0.92);
            border-left: 4px solid #ff4d4d;
            padding: 10px 12px;
            color: #fff;
            font-size: 12px;
            font-family: "Courier New", monospace;
            box-shadow: 0 0 14px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateX(16px);
            animation: toastIn 0.25s ease forwards;
        }

        .toast.green {
            border-left-color: #66ff66;
        }

        .toast.yellow {
            border-left-color: #ffb84d;
        }

        .toast .title {
            font-weight: 900;
            margin-bottom: 4px;
        }

        @keyframes toastIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .left-stack {
            position: fixed;
            top: 70px;
            left: 16px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            pointer-events: none;
        }

        .notif {
            background: rgba(0,0,0,0.88);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 8px 10px;
            color: #fff;
            font-size: 11px;
            font-family: "Courier New", monospace;
            box-shadow: 0 0 12px rgba(0,0,0,0.35);
            animation: slideIn 0.25s ease forwards;
        }

        .notif.red { border-left: 4px solid #ff4d4d; }
        .notif.green { border-left: 4px solid #66ff66; }
        .notif.yellow { border-left: 4px solid #ffb84d; }

        .notif .title {
            font-weight: 900;
            margin-bottom: 3px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .status-right {
            position: fixed;
            right: 18px;
            bottom: 20px;
            width: 290px;
            text-align: right;
            z-index: 20;
            font-family: "Courier New", monospace;
            font-size: 12px;
            color: #ff7070;
            text-shadow: 0 0 4px rgba(255,0,0,0.25);
            pointer-events: none;
        }

        .glow-tag {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 20;
            color: #ff4d4d;
            font-family: "Courier New", monospace;
            font-size: 11px;
            pointer-events: none;
        }

        .console-line {
            line-height: 1.2;
            opacity: 0.98;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div>CRACKED BY DIDLY</div>
        <div class="window-controls">
            <div class="control"></div>
            <div class="control"></div>
            <div class="control close"></div>
        </div>
    </div>

    <div class="overlay">
        <div class="layout">
            <div class="panel">
                <div class="bg-figures"></div>
                <div class="grain"></div>

                <div class="center-content">
                    <div class="main-title">"XXXTTRA DDOSSER"</div>

                    <div class="label">IP:</div>
                    <div class="input-line" contenteditable="true" data-placeholder="JAH IP HERE"></div>

                    <div class="label">PORT:</div>
                    <div class="input-line" contenteditable="true" data-placeholder="JAH PORT HERE"></div>

                    <button class="send-btn" id="sendBtn">SEND</button>

                    <div class="progress-wrap">
                        <div class="progress-label" id="progressLabel">status: idle</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>

                <div class="bottom-text">
                    MAINTAINED BY @PIBBLER
                    <span class="small">R E L A X 𝙾𝙽 𝚆𝚁𝙸𝚂𝚃 𝙻𝙾𝙾𝙺 𝚂𝙾 𝙱𝙴𝙰𝚄𝚃𝙸𝙵𝚄𝙻 ♛</span>
                </div>
            </div>

            <div class="console" id="console"></div>
        </div>
    </div>

    <div class="toast-stack" id="toastStack"></div>
    <div class="left-stack" id="leftStack"></div>

    <div class="status-right" id="statusRight">
        CONNECTION: STABLE<br>
        PACKETS: 0<br>
        LATENCY: 0ms
    </div>

    <div class="glow-tag">JAH MODE ON</div>

    <script>
        const btn = document.getElementById('sendBtn');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const statusRight = document.getElementById('statusRight');
        const consoleBox = document.getElementById('console');

        let interval = null;
        let loadInterval = null;
        let hasLoaded = false;
        let tick = 0;
        let spamInterval = null;
        let audioCtx;

        const consoleLines = [
            '0x7f9a33', '184.22.09.144', '0x00ff11a8', '8892 4401 7710',
            'SYS> 0048-77', '0x91abdc', '443.881.002', '127.0.0.1:8080',
            '0x1c04ff', '7742 0001 9922', '0xabcdef', '991.004.118',
            'SYS> 88a1-ff09', '0x1047be', '6382.77.199', '0x3a9c11',
            '11223344', '7710.0.0.9', '0xff0a11', '0044-9911',
            '0x59ffad', '9001.444.121', 'SYS> 11b0-77', '0x7c2d90'
        ];

        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function beep(freq = 620, duration = 0.04, type = 'square', volume = 0.02) {
            ensureAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = volume;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function clickSound() {
            beep(780, 0.03, 'square', 0.018);
        }

        function notifySound() {
            beep(520 + Math.random() * 220, 0.05, 'triangle', 0.02);
        }

        function addConsoleLine() {
            const line = consoleLines[Math.floor(Math.random() * consoleLines.length)];
            const lineEl = document.createElement('div');
            lineEl.className = 'console-line';
            lineEl.textContent = line;
            consoleBox.appendChild(lineEl);

            while (consoleBox.children.length > 30) {
                consoleBox.removeChild(consoleBox.firstChild);
            }

            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function addBurst(count) {
            for (let i = 0; i < count; i++) addConsoleLine();
        }

        function runLoadSequence() {
            if (hasLoaded) return;
            hasLoaded = true;

            let loadTick = 0;
            addBurst(8);

            loadInterval = setInterval(() => {
                loadTick += 20;
                progressFill.style.width = loadTick + '%';
                progressLabel.textContent = loadTick < 100 ? 'status: loading parody interface' : 'status: ready';
                statusRight.innerHTML =
                    `CONNECTION: STABLE<br>` +
                    `PACKETS: ${Math.floor(loadTick * 12).toLocaleString()}<br>` +
                    `LATENCY: ${12 + Math.floor(Math.random() * 40)}ms`;

                addBurst(6);
                notifySound();

                if (loadTick >= 100) {
                    clearInterval(loadInterval);
                    loadInterval = null;
                }
            }, 260);
        }

        btn.addEventListener('click', () => {
            ensureAudio();
            clickSound();

            if (interval) clearInterval(interval);
            if (spamInterval) clearInterval(spamInterval);

            tick = 0;
            progressFill.style.width = '0%';
            progressLabel.textContent = 'status: launching';

            addBurst(20);
            notifySound();

            spamInterval = setInterval(() => {
                addBurst(12);
                notifySound();
            }, 35);

            interval = setInterval(() => {
                tick += 4;
                progressFill.style.width = tick + '%';

                if (tick < 35) {
                    progressLabel.textContent = 'status: JAH JAH JAH';
                } else if (tick < 70) {
                    progressLabel.textContent = 'status: JUGG JUGG JUGG';
                } else if (tick < 100) {
                    progressLabel.textContent = 'status: AYO-';
                } else {
                    progressLabel.textContent = 'status: COMPLETE NGL';
                }

                const packets = Math.floor(tick * 42);
                const latency = 10 + Math.floor(Math.random() * 90);
                statusRight.innerHTML =
                    `CONNECTION: STABLE<br>` +
                    `PACKETS: ${packets.toLocaleString()}<br>` +
                    `LATENCY: ${latency}ms`;

                if (tick >= 100) {
                    clearInterval(interval);
                    interval = null;
                    clearInterval(spamInterval);
                    spamInterval = null;
                }
            }, 320);
        });

        runLoadSequence();
    </script>
</body>
</html>
