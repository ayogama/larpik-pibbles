<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XXXTra Ddosser - Joke UI</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        body {
            background:
                linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                url('https://fbi.cults3d.com/uploaders/16862511/illustration-file/ca1d4109-92fb-4952-af11-199e2ea62c10/xxxmix-xxxtentacion.gif') center center / cover no-repeat;
            filter: grayscale(100%);
        }

        .topbar {
            height: 28px;
            background: linear-gradient(#d9d9d9, #bfbfbf);
            border-bottom: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            color: #111;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .window-controls {
            display: flex;
            gap: 5px;
        }

        .control {
            width: 16px;
            height: 14px;
            border: 1px solid #888;
            background: #eee;
        }

        .control.close {
            background: #d9534f;
            border-color: #8b2c2a;
        }

        .overlay {
            width: 100%;
            height: calc(100% - 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.58);
        }

        .panel {
            width: 890px;
            max-width: 96vw;
            height: 520px;
            position: relative;
            color: #fff;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.03), rgba(0,0,0,0.7)),
                rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 35px rgba(0,0,0,0.85);
            overflow: hidden;
        }

        .bg-figures {
            position: absolute;
            inset: 0;
            background:
                url('https://cdn-images.dzcdn.net/images/cover/f65d5ac8c3a1cdba3d797ade79a47857/0x1900-000000-80-0-0.jpg') left center / 46% auto no-repeat,
                url('https://cdn-images.dzcdn.net/images/cover/f65d5ac8c3a1cdba3d797ade79a47857/0x1900-000000-80-0-0.jpg') right center / 46% auto no-repeat;
            filter: grayscale(100%) contrast(120%);
            opacity: 0.55;
        }

        .grain {
            position: absolute;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
            opacity: 0.28;
            pointer-events: none;
        }

        .center-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 48px;
            text-align: center;
        }

        .main-title {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 56px;
            text-shadow: 0 0 8px rgba(255,255,255,0.18);
        }

        .label {
            font-size: 21px;
            font-weight: 800;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .input-line {
            width: 220px;
            border-bottom: 2px solid rgba(255,255,255,0.55);
            padding-bottom: 3px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
        }

        .send-btn {
            margin-top: 24px;
            width: 210px;
            height: 28px;
            background: #ededed;
            border: 3px solid #bbb;
            color: #111;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #fff;
        }

        .bottom-text {
            position: absolute;
            bottom: 22px;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: 12px;
            line-height: 1.35;
            font-weight: 700;
        }

        .bottom-text .small {
            display: block;
            margin-top: 6px;
            font-size: 11px;
        }

        .fake-status {
            position: absolute;
            left: 10px;
            bottom: 8px;
            color: #ff4f4f;
            font-size: 11px;
            font-weight: 900;
            z-index: 2;
        }

        .toast {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(0,0,0,0.78);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 12px;
            font-size: 12px;
            color: #fff;
            z-index: 3;
            opacity: 0;
            transform: translateY(-8px);
            transition: 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div>CRACKED BY DESUDO</div>
        <div class="window-controls">
            <div class="control"></div>
            <div class="control"></div>
            <div class="control close"></div>
        </div>
    </div>

    <div class="overlay">
        <div class="panel">
            <div class="bg-figures"></div>
            <div class="grain"></div>

            <div class="center-content">
                <div class="main-title">"XXXTTRA DDOSSER"</div>

                <div class="label">IP:</div>
                <div class="input-line" contenteditable="true">JAH IP HERE</div>

                <div class="label">PORT:</div>
                <div class="input-line" contenteditable="true">JAH PORT HERE</div>

                <button class="send-btn" id="sendBtn">SEND</button>
            </div>

            <div class="bottom-text">
                MAINTAINED BY DESUDO#0001
                <span class="small">WELCOME TO DDOS BROTHER.</span>
            </div>

            <div class="fake-status">BOTNET ONLINE: true-</div>
            <div class="toast" id="toast">DDOS LAUNCHED, XXXTENTACION INBOUND</div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('sendBtn');
        const toast = document.getElementById('toast');

        btn.addEventListener('click', () => {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        });
    </script>
</body>
</html>
